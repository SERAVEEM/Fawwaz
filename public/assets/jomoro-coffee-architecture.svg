<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0a0d14" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141923" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0e121a" stop-opacity="0.98" />
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="emeraldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="amberAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>

    <!-- Filter for Glow Effects -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#38bdf8" />
    </marker>
    <marker id="arrowEmerald" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#34d399" />
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#fbbf24" />
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#c084fc" />
    </marker>
    <marker id="arrowMuted" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#64748b" />
    </marker>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="750" fill="url(#bgGrad)" />
  <rect width="1200" height="750" fill="url(#grid)" />

  <!-- Ambient Ambient Glow Orbs -->
  <circle cx="240" cy="380" r="180" fill="#38bdf8" opacity="0.04" filter="url(#softGlow)" />
  <circle cx="600" cy="380" r="180" fill="#34d399" opacity="0.04" filter="url(#softGlow)" />
  <circle cx="960" cy="380" r="180" fill="#fbbf24" opacity="0.04" filter="url(#softGlow)" />

  <!-- Top Title / Header Section -->
  <g transform="translate(60, 48)">
    <!-- Badge -->
    <rect x="0" y="0" width="138" height="24" rx="4" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <text x="69" y="16" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle" class="mono">SYSTEM ARCHITECTURE</text>

    <!-- Main Title -->
    <text x="0" y="52" fill="#ffffff" font-size="24" font-weight="700" letter-spacing="-0.5" class="sans">JOMORO KOFFEE V2 — DECOUPLED MICROSERVICES</text>
    <text x="0" y="74" fill="#94a3b8" font-size="13" font-weight="400" class="sans">NestJS 11 · Prisma ORM · Isolated MySQL Schemas · Stateless Passport JWT · Programmatic No-Regex Guards</text>
  </g>

  <!-- LAYER 1: CLIENT APPLICATION (Top) -->
  <g transform="translate(360, 150)">
    <!-- Box -->
    <rect x="0" y="0" width="480" height="66" rx="8" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <rect x="0" y="0" width="480" height="2" fill="url(#cyanAccent)" />
    
    <!-- Icon & Text -->
    <circle cx="36" cy="33" r="14" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 31 35 L 36 29 L 41 35 Z" fill="#38bdf8" />
    
    <text x="64" y="29" fill="#f8fafc" font-size="14" font-weight="600" class="sans">Web &amp; Mobile Client Interface</text>
    <text x="64" y="47" fill="#64748b" font-size="11" class="mono">React / Mobile / Swagger UI / Postman Client</text>

    <!-- Status badge -->
    <rect x="375" y="21" width="85" height="24" rx="4" fill="rgba(255, 255, 255, 0.05)" />
    <text x="417" y="37" fill="#cbd5e1" font-size="11" font-weight="500" text-anchor="middle" class="mono">HTTP / REST</text>
  </g>

  <!-- FLOW LINES: Client to Services -->
  <!-- Line to Auth -->
  <path d="M 440 216 L 440 250 L 230 250 L 230 286" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowCyan)" />
  <rect x="250" y="240" width="130" height="20" rx="3" fill="#07090e" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
  <text x="315" y="254" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle" class="mono">POST /auth/*</text>

  <!-- Line to Product -->
  <path d="M 600 216 L 600 286" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowEmerald)" />
  <rect x="535" y="240" width="130" height="20" rx="3" fill="#07090e" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1" />
  <text x="600" y="254" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle" class="mono">GET /products/*</text>

  <!-- Line to Transaction -->
  <path d="M 760 216 L 760 250 L 970 250 L 970 286" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowAmber)" />
  <rect x="820" y="240" width="130" height="20" rx="3" fill="#07090e" stroke="rgba(251, 191, 36, 0.3)" stroke-width="1" />
  <text x="885" y="254" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="middle" class="mono">POST /cart, /orders</text>

  <!-- LAYER 2: MICROSERVICES CONTAINERS (Middle Row) -->

  <!-- 1. AUTH SERVICE (Left) -->
  <g transform="translate(80, 290)">
    <rect x="0" y="0" width="300" height="190" rx="10" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5" />
    <rect x="0" y="0" width="300" height="3" fill="url(#cyanAccent)" />
    
    <!-- Header -->
    <text x="20" y="32" fill="#ffffff" font-size="16" font-weight="700" class="sans">AUTH SERVICE</text>
    <rect x="210" y="16" width="70" height="22" rx="4" fill="rgba(56, 189, 248, 0.15)" />
    <text x="245" y="31" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" class="mono">:3001</text>
    
    <!-- Subtitle / Meta -->
    <text x="20" y="56" fill="#94a3b8" font-size="11" class="mono">Passport JWT Auth &amp; Profiles</text>
    <line x1="20" y1="68" x2="280" y2="68" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

    <!-- Capabilities -->
    <g transform="translate(20, 84)">
      <circle cx="4" cy="6" r="3" fill="#38bdf8" />
      <text x="14" y="10" fill="#cbd5e1" font-size="12" class="sans">User Registration &amp; Roles</text>
      
      <circle cx="4" cy="28" r="3" fill="#38bdf8" />
      <text x="14" y="32" fill="#cbd5e1" font-size="12" class="sans">Stateless Bearer JWT Tokens</text>
      
      <circle cx="4" cy="50" r="3" fill="#38bdf8" />
      <text x="14" y="54" fill="#cbd5e1" font-size="12" class="sans">Custom No-Regex Validation</text>
      
      <circle cx="4" cy="72" r="3" fill="#38bdf8" />
      <text x="14" y="76" fill="#cbd5e1" font-size="12" class="sans">Swagger Docs: /api</text>
    </g>
  </g>

  <!-- 2. PRODUCT SERVICE (Center) -->
  <g transform="translate(450, 290)">
    <rect x="0" y="0" width="300" height="190" rx="10" fill="url(#cardGrad)" stroke="rgba(52, 211, 153, 0.35)" stroke-width="1.5" />
    <rect x="0" y="0" width="300" height="3" fill="url(#emeraldAccent)" />
    
    <!-- Header -->
    <text x="20" y="32" fill="#ffffff" font-size="16" font-weight="700" class="sans">PRODUCT SERVICE</text>
    <rect x="210" y="16" width="70" height="22" rx="4" fill="rgba(52, 211, 153, 0.15)" />
    <text x="245" y="31" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle" class="mono">:3002</text>
    
    <!-- Subtitle / Meta -->
    <text x="20" y="56" fill="#94a3b8" font-size="11" class="mono">Catalog, Categories &amp; Stock</text>
    <line x1="20" y1="68" x2="280" y2="68" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

    <!-- Capabilities -->
    <g transform="translate(20, 84)">
      <circle cx="4" cy="6" r="3" fill="#34d399" />
      <text x="14" y="10" fill="#cbd5e1" font-size="12" class="sans">Menu &amp; Category Filters</text>
      
      <circle cx="4" cy="28" r="3" fill="#34d399" />
      <text x="14" y="32" fill="#cbd5e1" font-size="12" class="sans">Admin Catalog CRUD Guards</text>
      
      <circle cx="4" cy="50" r="3" fill="#34d399" />
      <text x="14" y="54" fill="#cbd5e1" font-size="12" class="sans">Atomic Stock Decrement API</text>
      
      <circle cx="4" cy="72" r="3" fill="#34d399" />
      <text x="14" y="76" fill="#cbd5e1" font-size="12" class="sans">Swagger Docs: /api</text>
    </g>
  </g>

  <!-- 3. TRANSACTION SERVICE (Right) -->
  <g transform="translate(820, 290)">
    <rect x="0" y="0" width="300" height="190" rx="10" fill="url(#cardGrad)" stroke="rgba(251, 191, 36, 0.35)" stroke-width="1.5" />
    <rect x="0" y="0" width="300" height="3" fill="url(#amberAccent)" />
    
    <!-- Header -->
    <text x="20" y="32" fill="#ffffff" font-size="16" font-weight="700" class="sans">TRANSACTION SERVICE</text>
    <rect x="210" y="16" width="70" height="22" rx="4" fill="rgba(251, 191, 36, 0.15)" />
    <text x="245" y="31" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle" class="mono">:3003</text>
    
    <!-- Subtitle / Meta -->
    <text x="20" y="56" fill="#94a3b8" font-size="11" class="mono">Cart Sessions &amp; Orders</text>
    <line x1="20" y1="68" x2="280" y2="68" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

    <!-- Capabilities -->
    <g transform="translate(20, 84)">
      <circle cx="4" cy="6" r="3" fill="#fbbf24" />
      <text x="14" y="10" fill="#cbd5e1" font-size="12" class="sans">Customer Persistent Cart</text>
      
      <circle cx="4" cy="28" r="3" fill="#fbbf24" />
      <text x="14" y="32" fill="#cbd5e1" font-size="12" class="sans">Price Locking &amp; Checkout</text>
      
      <circle cx="4" cy="50" r="3" fill="#fbbf24" />
      <text x="14" y="54" fill="#cbd5e1" font-size="12" class="sans">Customer Order History</text>
      
      <circle cx="4" cy="72" r="3" fill="#fbbf24" />
      <text x="14" y="76" fill="#cbd5e1" font-size="12" class="sans">Swagger Docs: /api</text>
    </g>
  </g>

  <!-- INTER-SERVICE COMMUNICATION: Transaction -> Product -->
  <path d="M 820 375 L 755 375" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple)" />
  <rect x="752" y="348" width="85" height="20" rx="3" fill="#07090e" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1" />
  <text x="794" y="362" fill="#c084fc" font-size="9" font-weight="700" text-anchor="middle" class="mono">DEDUCT STOCK</text>

  <!-- LAYER 3: DATABASE TIER (Bottom Row) -->

  <!-- Database Connector Lines -->
  <!-- Auth -> DB -->
  <path d="M 230 480 L 230 550" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowCyan)" />
  <text x="240" y="520" fill="#64748b" font-size="10" class="mono">Prisma Client</text>

  <!-- Product -> DB -->
  <path d="M 600 480 L 600 550" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowEmerald)" />
  <text x="610" y="520" fill="#64748b" font-size="10" class="mono">Prisma Client</text>

  <!-- Transaction -> DB -->
  <path d="M 970 480 L 970 550" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowAmber)" />
  <text x="980" y="520" fill="#64748b" font-size="10" class="mono">Prisma Client</text>

  <!-- 1. AUTH DB -->
  <g transform="translate(110, 555)">
    <rect x="0" y="0" width="240" height="95" rx="8" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" />
    <path d="M 20 22 C 20 16, 40 16, 40 16 C 40 16, 60 16, 60 22 L 60 38 C 60 44, 40 44, 40 44 C 40 44, 20 44, 20 38 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <ellipse cx="40" cy="22" rx="20" ry="6" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="1.5" />
    
    <text x="75" y="32" fill="#ffffff" font-size="13" font-weight="600" class="sans">jomoro_auth</text>
    <text x="75" y="50" fill="#64748b" font-size="11" class="mono">MySQL Schema</text>
    
    <rect x="75" y="60" width="135" height="18" rx="3" fill="rgba(255, 255, 255, 0.04)" />
    <text x="82" y="73" fill="#94a3b8" font-size="10" class="mono">Tables: Users, Profiles</text>
  </g>

  <!-- 2. PRODUCT DB -->
  <g transform="translate(480, 555)">
    <rect x="0" y="0" width="240" height="95" rx="8" fill="url(#cardGrad)" stroke="rgba(52, 211, 153, 0.25)" stroke-width="1" />
    <path d="M 20 22 C 20 16, 40 16, 40 16 C 40 16, 60 16, 60 22 L 60 38 C 60 44, 40 44, 40 44 C 40 44, 20 44, 20 38 Z" fill="none" stroke="#34d399" stroke-width="1.5" />
    <ellipse cx="40" cy="22" rx="20" ry="6" fill="rgba(52, 211, 153, 0.2)" stroke="#34d399" stroke-width="1.5" />
    
    <text x="75" y="32" fill="#ffffff" font-size="13" font-weight="600" class="sans">jomoro_product</text>
    <text x="75" y="50" fill="#64748b" font-size="11" class="mono">MySQL Schema</text>
    
    <rect x="75" y="60" width="150" height="18" rx="3" fill="rgba(255, 255, 255, 0.04)" />
    <text x="82" y="73" fill="#94a3b8" font-size="10" class="mono">Tables: Products, Categories</text>
  </g>

  <!-- 3. TRANSACTION DB -->
  <g transform="translate(850, 555)">
    <rect x="0" y="0" width="240" height="95" rx="8" fill="url(#cardGrad)" stroke="rgba(251, 191, 36, 0.25)" stroke-width="1" />
    <path d="M 20 22 C 20 16, 40 16, 40 16 C 40 16, 60 16, 60 22 L 60 38 C 60 44, 40 44, 40 44 C 40 44, 20 44, 20 38 Z" fill="none" stroke="#fbbf24" stroke-width="1.5" />
    <ellipse cx="40" cy="22" rx="20" ry="6" fill="rgba(251, 191, 36, 0.2)" stroke="#fbbf24" stroke-width="1.5" />
    
    <text x="75" y="32" fill="#ffffff" font-size="13" font-weight="600" class="sans">jomoro_transaction</text>
    <text x="75" y="50" fill="#64748b" font-size="11" class="mono">MySQL Schema</text>
    
    <rect x="75" y="60" width="150" height="18" rx="3" fill="rgba(255, 255, 255, 0.04)" />
    <text x="82" y="73" fill="#94a3b8" font-size="10" class="mono">Tables: Carts, Orders, Items</text>
  </g>

  <!-- Footer security & constraint badge -->
  <g transform="translate(60, 685)">
    <rect x="0" y="0" width="1080" height="34" rx="6" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
    <circle cx="24" cy="17" r="4" fill="#38bdf8" />
    <text x="36" y="21" fill="#94a3b8" font-size="11" class="mono">ARCHITECTURE HIGHLIGHTS:</text>
    <text x="210" y="21" fill="#cbd5e1" font-size="11" class="sans">Shared JWT Secret for stateless cross-service verification · Strict No-Regex Programmatic Validation · Isolated Databases</text>
  </g>
</svg>
