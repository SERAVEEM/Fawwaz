<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090c" />
      <stop offset="60%" stop-color="#0e1117" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.15" />
    </linearGradient>

    <pattern id="dotGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255, 255, 255, 0.06)" />
    </pattern>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#dotGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="180" r="240" fill="#38bdf8" opacity="0.12" filter="url(#softBlur)" />
  <circle cx="250" cy="480" r="220" fill="#818cf8" opacity="0.08" filter="url(#softBlur)" />

  <!-- Outer Border Frame -->
  <rect x="36" y="36" width="1128" height="558" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

  <!-- Corner Brackets -->
  <path d="M 36 60 L 36 36 L 60 36" fill="none" stroke="#ffffff" stroke-width="2" />
  <path d="M 1164 60 L 1164 36 L 1140 36" fill="none" stroke="#ffffff" stroke-width="2" />
  <path d="M 36 570 L 36 594 L 60 594" fill="none" stroke="#ffffff" stroke-width="2" />
  <path d="M 1164 570 L 1164 594 L 1140 594" fill="none" stroke="#ffffff" stroke-width="2" />

  <!-- Content Block -->
  <g transform="translate(84, 110)">
    <!-- Top Meta Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="190" height="30" rx="3" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
      <circle cx="16" cy="15" r="4" fill="#38bdf8" />
      <text x="30" y="20" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.5" class="mono">PORTFOLIO · 2026</text>
    </g>

    <!-- Handle / Alias -->
    <text x="0" y="90" fill="#94a3b8" font-size="20" font-weight="600" letter-spacing="2" class="mono">@SERAVEEM</text>

    <!-- Full Legal Name -->
    <text x="0" y="175" fill="#ffffff" font-size="64" font-weight="900" letter-spacing="-1.5" class="sans">FAWWAZ SIDIQ</text>
    <text x="0" y="245" fill="#ffffff" font-size="64" font-weight="900" letter-spacing="-1.5" class="sans">NURSETO</text>

    <!-- Role and Domain -->
    <g transform="translate(0, 305)">
      <text x="0" y="0" fill="#38bdf8" font-size="24" font-weight="600" letter-spacing="0.5" class="sans">Product Engineer &amp; Creative Developer</text>
      <text x="0" y="32" fill="#94a3b8" font-size="16" font-weight="400" class="sans">Microservices · Fullstack Systems · Spatial UI · High-Performance Motion</text>
    </g>

    <!-- Footer Identity Bar -->
    <g transform="translate(0, 420)">
      <line x1="0" y1="0" x2="1032" y2="0" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="0" y="32" fill="#64748b" font-size="14" class="mono">CANONICAL: https://seraveem.github.io/Fawwaz/</text>
      <text x="1032" y="32" fill="#94a3b8" font-size="14" text-anchor="end" class="mono">GITHUB: github.com/SERAVEEM</text>
    </g>
  </g>
</svg>
